name: Release

on:
  push:
    tags: ['v*']

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Flippety ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
              prerelease: false,
            })
            return data.id

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Verified working locally with these exact SDK/NDK/JDK versions (see
  # commit history) — `tauri android init` + `tauri android build` produce
  # an installable APK and an AAB for Play Store, both release-signed (see
  # "configure Android release signing" below). `gen/android` is gitignored
  # and regenerated fresh by `android init` on every run, so the signing
  # config can't live as a one-time edit to the generated build.gradle.kts —
  # it's patched into it on every run instead.
  build-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'
      - name: set NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: tauri android init
        run: pnpm tauri android init --ci
      - name: regenerate icons into the freshly-created Android project
        # `tauri icon` writes mobile icons directly into `gen/android`, which
        # only exists after `android init` — without this the app ships with
        # a default placeholder icon instead of the real one.
        run: pnpm tauri icon src-tauri/icons/icon.png
      - name: configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/release.jks
          python3 - <<'PATCH'
          path = "src-tauri/gen/android/app/build.gradle.kts"
          content = open(path).read()

          signing_block = (
              '    signingConfigs {\n'
              '        create("release") {\n'
              '            storeFile = file("release.jks")\n'
              '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              '            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n'
              '            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n'
              '        }\n'
              '    }\n'
          )
          marker = "    buildTypes {"
          assert marker in content, "build.gradle.kts shape changed — update the signing patch"
          content = content.replace(marker, signing_block + marker, 1)

          release_marker = 'getByName("release") {\n            isMinifyEnabled = true'
          assert release_marker in content, "release buildType shape changed — update the signing patch"
          content = content.replace(
              release_marker,
              'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = true',
              1,
          )

          open(path, "w").write(content)
          PATCH
      - name: tauri android build (release APK + AAB)
        run: pnpm tauri android build --ci --apk --aab
      - name: locate and rename build outputs
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)"
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n1)"
          cp "$apk" "flippety-${{ github.ref_name }}-android.apk"
          cp "$aab" "flippety-${{ github.ref_name }}-android.aab"
      - name: upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flippety-android
          path: |
            flippety-${{ github.ref_name }}-android.apk
            flippety-${{ github.ref_name }}-android.aab
          if-no-files-found: error
      - name: attach build outputs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            flippety-${{ github.ref_name }}-android.apk
            flippety-${{ github.ref_name }}-android.aab
